<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com https://*.microsoft.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://appsforoffice.microsoft.com; frame-src 'self'; object-src 'none'">
<title>חלונית הסקירה</title>
<link rel="stylesheet" href="fonts.css?v=0.5.5">
<link rel="stylesheet" href="review.css?v=0.5.5">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="version.js?v=0.5.5"></script>
<script src="core.js?v=0.5.5"></script>
<script src="wordPortFake.js?v=0.5.5"></script>
<script src="wordPortWord.js?v=0.5.5"></script>
</head>
<body>
<div id="app">
  <div id="status">
    <div class="srow">
      <span id="sTitle"></span>
      <span id="sLeft"></span>
      <span id="sTrack" class="chip"></span>
    </div>
    <div class="srow">
      <span id="sPos"></span>
      <span class="sbtns"><button id="bPgUp" class="mini" title="קטע קודם (PageUp)">▲</button><button id="bPgDn" class="mini" title="קטע הבא (PageDown)">▼</button><button id="bCur" class="mini" title="לפסקה שבה הסמן עומד ב-Word">לסמן</button><button id="bList" class="mini">רשימה</button><button id="bMore" class="mini">עוד</button></span>
    </div>
  </div>
  <div id="text" dir="rtl"></div>
  <div id="det"><div id="detIn"></div><div id="detMore">יש המשך ▾</div></div>
  <div id="btns">
    <div id="row1"></div>
    <div id="row2">
      <button id="bPrev" class="nav">→ הקודם</button>
      <button id="bNote" class="mini">הערה לדחייה</button>
      <span id="ver"></span>
      <button id="bNext" class="nav">הבא ←</button>
    </div>
  </div>
  <div id="screen" hidden></div>
  <div id="measure" aria-hidden="true"></div>
</div>
<script src="review.js?v=0.5.5"></script>
</body>
</html>
